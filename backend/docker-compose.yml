version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://cameratrace:cameratrace@postgres:5432/cameratrace
      - UPLOAD_DIR=/app/artifacts/uploads
      - MODEL_DIR=/app/models
      - ENABLE_ROBUSTNESS=true
    volumes:
      - ./artifacts:/app/artifacts
      - ./models:/app/models
      - ./datasets:/app/datasets
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cameratrace
      POSTGRES_PASSWORD: cameratrace
      POSTGRES_DB: cameratrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
